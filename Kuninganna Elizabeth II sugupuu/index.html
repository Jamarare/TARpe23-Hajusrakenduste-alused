<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>Briti kuningliku sugupuu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: left;
    }
    .short-name {
      background-color: #b6f1b6;
    }
    input, select {
      margin: 5px 10px 5px 0;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Briti kuningliku sugupuu</h1>

  <label for="searchName">Otsi nime järgi:</label>
  <input type="text" id="searchName" placeholder="Sisesta nimi" />

  <label for="searchSymbol">Otsi nime sisaldava sümboli järgi:</label>
  <input type="text" id="searchSymbol" placeholder="Sisesta sümbol" maxlength="1" size="1" />

  <label for="searchLength">Vali nime pikkus:</label>
  <select id="searchLength">
    <option value="all">Kõik</option>
    <option value="lt7">Alla 7 tähe</option>
    <option value="gte7">7 või rohkem tähe</option>
  </select>

  <table id="familyTree">
    <thead>
      <tr>
        <th>Nimi</th>
        <th>Sünniaasta</th>
        <th>Vanem</th>
        <th>Vanavanem</th>
        <th>Laste arv</th>
        <th>Elus vanus (2025)</th>
        <th>Sünniaasta vs. vanema sünniaasta</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script src="index.js"></script>
</body>
</html>
